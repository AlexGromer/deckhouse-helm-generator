# A shop: API in front of PostgreSQL, plus a worker built from source.
services:
  api:
    image: registry.example.com/shop/api:${API_TAG:-1.0.0}
    ports:
      - "80:8080"
    environment:
      DATABASE_URL: postgres://shop@db:5432/shop
      DATABASE_PASSWORD: dev-only
      LOG_LEVEL: info
    user: "10001:10001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/var/lib/shop/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "1", memory: 512M}
        reservations: {cpus: "0.25", memory: 256M}
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: dev-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: pg_isready -U postgres
  worker:
    build: ./worker
    command: ["--queue", "orders"]
volumes:
  uploads: {}
  pgdata: {}
