# An application exposed through Istio's Kubernetes Ingress support
# (ingressClassName: istio): TLS, Exact/Prefix/ImplementationSpecific paths,
# a named Service port and a default backend. Exercises `--detect-ingress`
# (Istio note) and `--with istio-ingress` (Gateway + VirtualService).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: default
  labels:
    app.kubernetes.io/name: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop
    spec:
      containers:
        - name: shop
          image: registry.example.com/shop:1.4.2
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: default
  labels:
    app.kubernetes.io/name: shop
spec:
  selector:
    app.kubernetes.io/name: shop
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: default
  labels:
    app.kubernetes.io/name: shop
spec:
  ingressClassName: istio
  tls:
    - hosts:
        - shop.example.com
      secretName: shop-tls
  defaultBackend:
    service:
      name: shop
      port:
        name: http
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: shop
                port:
                  number: 80
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  name: http
    - host: legacy.example.com
      http:
        paths:
          - path: /old
            pathType: ImplementationSpecific
            backend:
              service:
                name: shop
                port:
                  name: http
