apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: orders
        image: registry.example.com/shop/orders:2.1.0
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: shop
  labels:
    app: legacy
spec:
  selector:
    matchLabels:
      app: legacy
  template:
    metadata:
      labels:
        app: legacy
    spec:
      volumes:
      - name: data
        hostPath:
          path: /var/lib/legacy
      containers:
      - name: legacy
        image: registry.example.com/shop/legacy:1.0
        volumeMounts:
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shop
spec:
  selector:
    app: orders
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders
  namespace: shop
  labels:
    app: orders
    prometheus: main
spec:
  selector:
    matchLabels:
      app: orders
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: orders
  namespace: shop
  labels:
    app: orders
    prometheus: main
spec:
  groups:
  - name: orders.rules
    rules:
    - alert: OrdersHighErrorRate
      expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 1
      for: 5m
      labels:
        severity: warning
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-dashboard
  namespace: shop
  labels:
    app: orders
    grafana_dashboard: "1"
data:
  orders.json: '{"title":"Orders","panels":[]}'
